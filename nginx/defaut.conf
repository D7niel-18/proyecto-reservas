server {
    listen 8080;                      # Puerto interno (Nginx sin root no puede usar el 80)
    server_name localhost;
    server_tokens off;                # Oculta la versión de Nginx en cabeceras y errores

    # Frontend estático (SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # Si el archivo no existe, sirve index.html
    }

    # Proxy inverso hacia la API (contenedor "api", red frontend)
    location /api/ {
        proxy_pass http://api:3000/;  # La barra final elimina el prefijo /api/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                       # IP real del cliente
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # Cadena de proxies
        proxy_set_header X-Forwarded-Proto $scheme;                    # http o https
    }
}